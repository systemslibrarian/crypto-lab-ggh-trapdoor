# ONE workflow, on purpose. Triggers, gate, deploy and dependabot auto-merge all
# live here together.
#
# The alternative -- a `ci.yml` holding the gate and a `deploy.yml` holding the
# publish -- is what two of the three "fixed" siblings do (falcon-seal,
# lll-break), and both drifted the same way: a bare `pages` concurrency group and
# no `if:` on the deploy job. They get away with it only because their deploy
# file never sees `pull_request`. It also breaks the safety argument below:
# `needs:` cannot cross workflow files, so an auto-merge job in `ci.yml` is blind
# to whatever `deploy.yml` checks. crypto-lab-lattice-gentle is the one compliant
# sibling and is the shape copied here (fleet: 105 of 189 auto-merge jobs live in
# deploy.yml, and all 105 of those files also carry the pull_request trigger).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:            # the gate must judge PRs too -- see template 6.1
    branches: [main]
  workflow_dispatch:       # the post-merge dispatch below depends on this -- see 6.2

# Least privilege at the top; escalation only in the job that needs it. This
# block used to carry `pages: write` and `id-token: write` for the whole
# workflow, which handed those scopes to every job -- including the one that runs
# a Dependabot PR's freshly downloaded devDependencies. Only `deploy` publishes,
# so only `deploy` gets them (see the job-level blocks below).
#
# A job-level `permissions:` block REPLACES this one rather than adding to it,
# which is exactly what makes the split safe to reason about: each job's block is
# its complete set of scopes, not a delta.
permissions:
  contents: read

concurrency:
  # NOT a bare `pages`: with cancel-in-progress that lets a pull-request run
  # cancel a live deploy of main. Fleet-wide this is 141 correct vs 48 bare, and
  # the bare population is exactly the two-workflow shape described above.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # `contents: read` is for the checkout. `pages: read` is for
    # actions/configure-pages and nothing else: at v6 its `enablement` input
    # defaults to `false`, so it never calls the create-site endpoint -- it makes
    # one `GET /repos/{owner}/{repo}/pages` to read the site metadata, and that
    # endpoint is satisfied by Pages *read*. Checked against src/api-client.js at
    # the pinned SHA: findOrCreatePagesSite() calls getPagesSite() first and only
    # reaches enablePagesSite() when enablement is true.
    #
    # Neither artifact upload needs a scope here -- both authenticate with the
    # Actions runtime token, not GITHUB_TOKEN.
    permissions:
      contents: read
      pages: read
    steps:
      # Third-party actions are pinned to the full commit SHA, not the tag: a tag
      # is a mutable pointer the action's owner can move, so `@v7` is a promise
      # rather than a fact, and the whole supply-chain argument for `npm ci` from
      # a committed lock is undone if the runner's actions are floating. The
      # trailing `# vN` is not decoration -- Dependabot reads that comment to know
      # which version a SHA stands for, and rewrites both together, so pinning
      # here does NOT freeze these at the audited version.
      #
      # Every SHA below was resolved on 2026-09-08 with
      #   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
      # and cross-checked with `gh api repos/<owner>/<repo>/commits/<tag>`. All
      # seven tags are lightweight, so ref/tags already names the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Read from .nvmrc rather than repeating "22" here. Finding 15 asks for
          # a checked-in Node version file MATCHING CI, and two files both
          # spelling the same string is a convention, not a guarantee -- this
          # makes .nvmrc the single source and CI the consumer. It still resolves
          # to the current 22.x line, unchanged from the previous `node-version:
          # 22`. package.json `engines` records the floor the toolchain actually
          # needs (vitest 5 refuses <22.12 and every odd-numbered Node line).
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install`: the committed package-lock.json is the
      # thing Dependabot bumps, and a bump that does not install from the lock
      # has not been tested.
      - run: npm ci

      # `npm run check` is the one command a fresh clone runs to reproduce this
      # gate, but CI deliberately does NOT call it as a single step: collapsing
      # four gates into one costs the thing that makes a failure legible here --
      # the red step name in the run summary tells you WHICH gate rejected the
      # change, and the auto-merge job below rests its whole safety argument on
      # "this lab's own gate went green", which is only auditable if you can see
      # which gate that was.
      #
      # The price of running the steps individually is drift: `check` could
      # quietly stop running the claims suite and no run would notice. So assert
      # the aggregate still composes exactly the four scripts the steps below
      # run, in the same order. Pure string check on package.json, no
      # dependencies, ~1s, and it fails before the browser suites rather than
      # after them.
      - name: Aggregate gate still matches these steps
        run: |
          node -e '
            const check = (require("./package.json").scripts || {}).check || "";
            const need = ["npm run build", "npm test", "npm run test:claims", "npm run test:a11y"];
            let at = -1;
            for (const n of need) {
              const i = check.indexOf(n);
              if (i < 0) {
                console.error(`::error::npm run check no longer runs \`${n}\`; it is: ${check}`);
                process.exit(1);
              }
              if (i < at) {
                console.error(`::error::npm run check runs \`${n}\` out of CI order; it is: ${check}`);
                process.exit(1);
              }
              at = i;
            }
          '

      # Order below is the order `npm run check` runs them in, so the local
      # command and CI cannot disagree about what passing means.
      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Unit tests (Vitest, incl. spec KATs)
        run: npm test

      # NEVER `--with-deps`: that apt step wedged 547 CI runs across this fleet
      # in one afternoon, and kickoff.md bans it outright. ubuntu-latest already
      # carries the shared libraries headless chromium needs.
      #
      # We are knowingly diverging from almost the whole fleet here: 196 of the
      # 210 `npx playwright install` lines across ~188 repos still carry the
      # banned flag, including all three siblings this workflow is modelled on,
      # because _MASTER-TEMPLATE.md section 6 (and 4.1) still prints the banned
      # form. kickoff.md is the later correction and wins. Do not "fix" this line
      # back to match the neighbours.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # BOTH Playwright projects run, by name, and both gate the publish.
      # A 2026-08-14 sweep found 29 repos whose deploy ran `test:a11y` alone, so
      # their correctness suites -- the ones asserting the crypto actually works
      # -- never blocked a publish. `npm test` above covers the Vitest unit
      # suite; these two cover the browser.
      #
      # The claims suite is the correctness gate: I1 same-lattice, I2 decryption
      # bound, Break 1 recovery, the negative claims (mod-2sigma fails on a
      # non-constant-magnitude error; the descent fails on Gaussian signatures),
      # Break 2 row recovery up to sign/permutation. A regression in the math
      # must not be publishable, so it runs before the artifact upload.
      - name: Claims gate (e2e claims suite, invariants I1-I5)
        run: npm run test:claims

      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA)
        run: npm run test:a11y

      # Traces/screenshots for whichever of the two gates failed. `if: failure()`
      # so a green run uploads nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      # `enablement` is left at its v6 default of false: this repo's Pages site
      # already exists and is set to build from Actions, so this step only reads
      # site metadata. That is what lets the job hold `pages: read` instead of
      # `pages: write`.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    # NOT `== 'push'`. That form also skips workflow_dispatch, which is the one
    # trigger the post-merge dispatch below relies on: the dispatched run would
    # check out, build, pass the whole gate, and then SKIP the deploy job.
    # Observed on a real run in lattice-gentle: build=success, deploy=SKIPPED,
    # site still serving the previous build with nothing going red.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # The only job that publishes, so the only job holding publish rights.
    # `pages: write` lets GITHUB_TOKEN create the Pages deployment; `id-token:
    # write` lets the runner request the OIDC token that proves the deployment
    # came from this workflow run. Both are documented as the minimum in
    # actions/deploy-pages' README at the pinned SHA. No `contents:` scope: this
    # job never checks out the repository, it only hands Pages an artifact id.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Dependabot only. `needs: build` is the whole safety argument -- a bump can
  # only merge itself once this lab's own gate (Vitest units, typecheck+build,
  # axe WCAG, claims suite) went green on the PR. The gate decides, not the
  # version number.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # A job-level permissions block REPLACES the default scopes rather than
    # adding to them. Without `actions: write` the deploy dispatch below returns
    # HTTP 403 "Resource not accessible by integration", and because that call
    # ends in `|| echo "::warning::"` the job still goes green while the site
    # never rebuilds. Nine labs were found drifting this way on 2026-08-20.
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      # @v3, not the @v2 that _MASTER-TEMPLATE.md section 6.1 still prints: the
      # fleet moved and is now 188 of 189 on v3.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate judges a bump far better than its version
      # number does. A major that actually breaks this lab fails the gate and
      # stays open for a human. (Majors are still ungrouped in dependabot.yml,
      # which is a different question -- see the comment there.)
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
